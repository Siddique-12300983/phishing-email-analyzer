[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-analyzer"
version = "1.0.0"
description = "Offline triage of a .eml file: header checks, SPF/DKIM/DMARC, URLs, attachments and red flags."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Abu Bakar Siddique" }]

[project.scripts]
phishing-email-analyzer = "phishanalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["phishanalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
